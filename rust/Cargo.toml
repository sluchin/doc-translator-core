[package]
name = "doc-translator-core"
version = "0.1.0"
description = "The common Rust code of the documentation translator apps (Tauri)"
authors = ["Tetsuya Higashi"]
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# キャッシュの書き出しと読み込み (保存と選択の画面. Android では, Google Drive も選べる) と, 選んだファイルの読み書き
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-mlkit = { path = "../plugins/tauri-plugin-mlkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS は rustls (Android でも同じように動く. OpenSSL を使わない)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt", "time"] }
url = "2"
regex = "1"
# ログ (標準エラー出力と, アプリのデータのログファイル)
log = "0.4"
env_logger = "0.11"


[dev-dependencies]
# ログのテストの, 一時的なディレクトリ
tempfile = "3"

# cargo tarpaulin の除外 (`#[cfg(not(tarpaulin_include))]`) を, 未知の cfg として警告しない
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
