# 共通のライブラリの検査. アプリ (zephyr-doc, kotlin-doc) も, 同じ開発用のイメージ (docker/Dockerfile) を使う.
# コンテナはホストのユーザーで実行する. UID と GID はシェルでエクスポートしておく
x-common: &common
  build:
    context: docker
    dockerfile: Dockerfile
    target: dev
  image: doc-translator-dev:latest
  volumes:
    - .:/workspace
    - ${CARGO_HOME_DIR:-cargo-home}:/cargo-home
    - npm-cache:/npm-cache
  working_dir: /workspace
  user: "${UID:-0}:${GID:-0}"
  environment:
    - HOME=/tmp

services:
  # 開発シェル
  dev:
    <<: *common
    stdin_open: true
    tty: true
    command: /bin/bash

  # 依存関係を入れる (node_modules)
  install:
    <<: *common
    command: npm ci

  # TypeScript の単体テスト (Vitest + jsdom) と, Rust の単体テスト
  test:
    <<: *common
    command: sh -c "npm test && cargo test"

  # カバレッジ. TypeScript (ts/lib の行と分岐) と Rust (rust/ の行. cargo tarpaulin) の, どちらも 100% でなければ失敗する.
  # ML Kit のプラグイン (plugins/) は, Tauri への登録と Android の呼び出しだけなので, 測らない
  coverage:
    <<: *common
    command: sh -c "npm run coverage && cargo tarpaulin -p doc-translator-core --engine llvm --exclude-files 'plugins/*' --fail-under 100 --out Html"

  # 整形の確認 (Prettier と rustfmt)
  format:
    <<: *common
    command: sh -c "npm run format && cargo fmt --all --check"

  # 整形して, ファイルを書き換える
  format-fix:
    <<: *common
    command: sh -c "npm run format:fix && cargo fmt --all"

  # 静的解析: 型の検査 (tsc), ESLint, Clippy (警告があれば失敗する)
  analyze:
    <<: *common
    command: sh -c "npm run typecheck && npm run lint && cargo clippy --all-targets -- -D warnings"

volumes:
  cargo-home:
  npm-cache:
