# Dependabot: 依存の更新を, 週に 1 回 PR にする (マイナー版とパッチ版は, 種類ごとに 1 つの PR にまとめる).
# PR では, いつもの CI が走る. マージは手で行う.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
    ignore:
      # TypeScript 7 は, typescript-eslint が対応するまで上げない.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # 一緒に上げないと, 版がずれて動かない組 (メジャー版も含めて, 1 つの PR にする).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gradle"
    directories:
      - "/plugins/tauri-plugin-mlkit/android"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
